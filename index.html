    function Icon({ name, className = 'w-4 h-4', ariaHidden = true }) {
      const spanRef = useRef(null);
      useEffect(() => {
        if (!spanRef.current || !window.lucide || !window.lucide.icons) return;
        const iconDef = window.lucide.icons[name] ||
                        window.lucide.icons[name.toLowerCase()] ||
                        window.lucide.icons[name.charAt(0).toUpperCase() + name.slice(1)];
        if (!iconDef) return;
        const svgElement = window.lucide.createElement(iconDef);
        svgElement.setAttribute('class', className);
        if (ariaHidden) svgElement.setAttribute('aria-hidden', 'true');
        spanRef.current.innerHTML = '';
        spanRef.current.appendChild(svgElement);
      }, [name, className, ariaHidden]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    }

    // ========================================================================
    // TEXT-TO-SPEECH (WEB SPEECH API - SUARA ASLI INDONESIA)
    // ========================================================================
    const speechHelper = {
      isSpeaking: false,
      speak(text, onEnd) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*_#`]/g, '');
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        utterance.pitch = 1.05;
        const voices = window.speechSynthesis.getVoices();
        const idVoice = voices.find((v) => v.lang.startsWith('id') || v.lang.includes('ID'));
        if (idVoice) utterance.voice = idVoice;
        utterance.onend = () => {
          this.isSpeaking = false;
          if (onEnd) onEnd();
        };
        utterance.onerror = () => {
          this.isSpeaking = false;
          if (onEnd) onEnd();
        };
        this.isSpeaking = true;
        window.speechSynthesis.speak(utterance);
      },
      stop() {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          this.isSpeaking = false;
        }
      }
    };

    // ========================================================================
    // SOUND & SYNTHESIZED AMBIENCE & LO-FI BGM (WEB AUDIO API - 100% OFFLINE)
    // ========================================================================
    const soundManager = {
      muted: false,
      ctx: null,
      rainSource: null,
      rainGain: null,
      lofiPlaying: false,
      lofiTimer: null,

      getCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },

      playClick() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.09);
        } catch (_) {}
      },

      playCoin() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          [987.77, 1318.51].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.07);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.07);
            osc.stop(ctx.currentTime + i * 0.07 + 0.22);
          });
        } catch (_) {}
      },

      playVictory() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.1);
            osc.stop(ctx.currentTime + i * 0.1 + 0.65);
          });
        } catch (_) {}
      },

      playThunder() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(90, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.75);
        } catch (_) {}
      },

      playBuild() {
        if (this.muted) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.22);
          });
        } catch (_) {}
      },

      startRain() {
        if (this.muted || this.rainSource) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const bufferSize = ctx.sampleRate * 2;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            lastOut = (lastOut + 0.02 * white) / 1.02;
            data[i] = lastOut * 3.5;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1100;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.08, ctx.currentTime);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          noise.start();
          this.rainSource = noise;
          this.rainGain = gain;
        } catch (_) {}
      },

      stopRain() {
        try {
          if (this.rainSource) {
            this.rainSource.stop();
            this.rainSource.disconnect();
            this.rainSource = null;
          }
        } catch (_) {}
      },

      // Relaxing Lo-Fi Pentatonic BGM Generator (Offline Synth)
      startLoFi() {
        if (this.muted || this.lofiPlaying) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        this.lofiPlaying = true;
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C D E G A C
        const bassNotes = [130.81, 164.81, 174.61, 196.00]; // C3, E3, F3, G3
        let step = 0;

        const playTick = () => {
          if (!this.lofiPlaying) return;
          try {
            const t = ctx.currentTime;
            if (step % 4 === 0) {
              const bassOsc = ctx.createOscillator();
              const bassGain = ctx.createGain();
              bassOsc.type = 'sine';
              bassOsc.frequency.setValueAtTime(bassNotes[(step / 4) % bassNotes.length], t);
              bassGain.gain.setValueAtTime(0.06, t);
              bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
              bassOsc.connect(bassGain);
              bassGain.connect(ctx.destination);
              bassOsc.start(t);
              bassOsc.stop(t + 0.95);
            }
            if (Math.random() < 0.75) {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(scale[Math.floor(Math.random() * scale.length)], t);
              gain.gain.setValueAtTime(0.035, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.5);
            }
            step++;
          } catch (_) {}
          this.lofiTimer = setTimeout(playTick, 380);
        };
        playTick();
      },

      stopLoFi() {
        this.lofiPlaying = false;
        if (this.lofiTimer) {
          clearTimeout(this.lofiTimer);
          this.lofiTimer = null;
        }
      }
    };

        }));
        burstParticlesRef.current.push(...newParticles);
      }, [burstTrigger]);

      const drawVoxelBlock = useCallback((ctx, sx, sy, tileW, tileH, height, topColor, leftColor, rightColor, isGlowing = false) => {
        const hw = tileW / 2;
        const hh = tileH / 2;

        if (isGlowing) {
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 12;
        }

        ctx.beginPath();
        ctx.moveTo(sx, sy - height);
        ctx.lineTo(sx + hw, sy + hh - height);
        ctx.lineTo(sx, sy + tileH - height);
        ctx.lineTo(sx - hw, sy + hh - height);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(sx - hw, sy + hh - height);
        ctx.lineTo(sx, sy + tileH - height);
        ctx.lineTo(sx, sy + tileH);
        ctx.lineTo(sx - hw, sy + hh);
        ctx.closePath();
        ctx.fillStyle = leftColor;
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(sx + hw, sy + hh - height);
        ctx.lineTo(sx, sy + tileH - height);
        ctx.lineTo(sx, sy + tileH);
        ctx.lineTo(sx + hw, sy + hh);
        ctx.closePath();
        ctx.fillStyle = rightColor;
        ctx.fill();

        if (isGlowing) ctx.shadowBlur = 0;
      }, []);

      // Render Loop
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const tileW = 46;
        const tileH = 23;

        const isoToScreen = (gx, gy) => ({
          x: (gx - gy) * (tileW / 2),
          y: (gx + gy) * (tileH / 2)
        });

        const render = () => {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
          }

          ctx.save();
          ctx.scale(dpr, dpr);

          const time = Date.now() * 0.0025;

          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const maxDim = Math.max(rect.width, rect.height) * 0.85;
          const seaGrad = ctx.createRadialGradient(cx, cy, 40, cx, cy, maxDim);

          if (timeMode === 'night' || timeMode === 'aurora') {
            seaGrad.addColorStop(0, '#1e293b');
            seaGrad.addColorStop(0.55, '#0f172a');
            seaGrad.addColorStop(1, '#020617');
          } else if (timeMode === 'sunset') {
            seaGrad.addColorStop(0, '#fb923c');
            seaGrad.addColorStop(0.45, '#c026d3');
            seaGrad.addColorStop(1, '#4c1d95');
          } else if (timeMode === 'storm') {
            seaGrad.addColorStop(0, '#334155');
            seaGrad.addColorStop(0.55, '#1e293b');
            seaGrad.addColorStop(1, '#0f172a');
          } else {
            seaGrad.addColorStop(0, '#38bdf8');
            seaGrad.addColorStop(0.55, '#0ea5e9');
            seaGrad.addColorStop(1, '#0284c7');
          }

          ctx.fillStyle = seaGrad;
          ctx.fillRect(0, 0, rect.width, rect.height);

          if (timeMode === 'storm' && Math.random() < 0.015) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(0, 0, rect.width, rect.height);
            soundManager.playThunder();
          }

          if (timeMode === 'aurora') {
            ctx.save();
            for (let a = 0; a < 3; a++) {
              ctx.beginPath();
              ctx.moveTo(0, rect.height * 0.2);
              for (let ax = 0; ax <= rect.width; ax += 50) {
                const waveY = rect.height * 0.15 + Math.sin(time * 1.5 + ax * 0.008 + a) * 45;
                ctx.lineTo(ax, waveY);
              }
              ctx.lineTo(rect.width, 0);
              ctx.lineTo(0, 0);
              ctx.closePath();
              ctx.fillStyle = a === 0 ? 'rgba(52, 211, 153, 0.18)' : a === 1 ? 'rgba(192, 132, 252, 0.15)' : 'rgba(56, 189, 248, 0.12)';
              ctx.fill();
            }
            ctx.restore();
          }

          if (timeMode === 'night' || timeMode === 'aurora') {
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 45; i++) {
              const sx = (i * 137.5) % rect.width;
              const sy = (i * 93.3) % (rect.height * 0.7);
              const twinkle = (Math.sin(time * 2 + i) + 1) * 0.45 + 0.1;
              ctx.globalAlpha = twinkle;
              ctx.beginPath();
              ctx.arc(sx, sy, i % 3 === 0 ? 1.8 : 1.2, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }

          const camCenterX = rect.width / 2 + camera.x;
          const camCenterY = rect.height / 2 + camera.y;
          ctx.translate(camCenterX, camCenterY);
          ctx.scale(camera.zoom, camera.zoom);

          ctx.strokeStyle = timeMode === 'storm' ? 'rgba(255, 255, 255, 0.25)' : 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1;
          const waveAmp = timeMode === 'storm' ? 4.5 : 2.5;

          for (let gx = -14; gx <= 14; gx += 2) {
            for (let gy = -14; gy <= 14; gy += 2) {
              const p = isoToScreen(gx, gy);
              const wave = Math.sin(time + gx * 0.4 + gy * 0.4) * waveAmp;
              ctx.beginPath();
              ctx.moveTo(p.x - 9, p.y + wave);
              ctx.lineTo(p.x + 9, p.y + wave);
              ctx.stroke();
            }
          }

          // Awan Melayang
          const clouds = [
            { gx: -11, gy: -1, speed: 0.4 },
            { gx: 2, gy: -12, speed: 0.3 },
            { gx: 11, gy: 2, speed: 0.35 }
          ];
          const cloudTopColor = timeMode === 'storm' ? 'rgba(71, 85, 105, 0.95)' : timeMode === 'sunset' ? 'rgba(254, 215, 170, 0.9)' : timeMode === 'night' ? 'rgba(148, 163, 184, 0.6)' : 'rgba(255, 255, 255, 0.92)';
          clouds.forEach((c, idx) => {
            const drift = Math.sin(time * c.speed + idx) * 18;
            const cp = isoToScreen(c.gx, c.gy);
            drawVoxelBlock(ctx, cp.x + drift, cp.y - 55, 58, 29, 14, cloudTopColor, 'rgba(100, 116, 139, 0.6)', 'rgba(71, 85, 105, 0.6)');
          });

          // EKOSISTEM: BURUNG CAMAR VOXEL TERBANG MELINGKAR
          for (let b = 0; b < 3; b++) {
            const birdAngle = time * 0.8 + b * 2.1;
            const bx = Math.cos(birdAngle) * (90 + b * 40);
            const by = Math.sin(birdAngle) * (50 + b * 20) - 100 - b * 15;
            const flap = Math.sin(time * 8 + b) * 3;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bx, by, 6, 3);
            ctx.fillRect(bx - 5, by - flap, 5, 2);
            ctx.fillRect(bx + 6, by - flap, 5, 2);
          }

          // EKOSISTEM: LUMBA-LUMBA VOXEL MELOMPAT DI LAUT
          const dolphinPhase = Math.sin(time * 2.5);
          if (dolphinPhase > 0) {
            const dArcY = -dolphinPhase * 28;
            const dx = 130 + Math.sin(time * 0.5) * 40;
            const dy = -60 + dArcY;
            drawVoxelBlock(ctx, dx, dy, 12, 6, 6, '#38bdf8', '#0284c7', '#0369a1');
            drawVoxelBlock(ctx, dx + 4, dy + 2, 6, 3, 4, '#0ea5e9', '#0369a1', '#075985');
            // Cipratan air
            ctx.beginPath();
            ctx.arc(dx, -60, 8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
          }

          const allTiles = [];
          const newHitboxes = [];

          islands.forEach((isl, islIdx) => {
            const r = isl.radius;
            const centerScreen = isoToScreen(isl.gridX, isl.gridY);
            newHitboxes.push({ id: isl.id, x: centerScreen.x, y: centerScreen.y - 14, hitRadius: r * 26 });

            const foamPulse = Math.sin(time * 2.5 + islIdx) * 2;
            ctx.beginPath();
            ctx.ellipse(centerScreen.x, centerScreen.y + 4, r * 22 + foamPulse, r * 11 + foamPulse * 0.5, 0, 0, Math.PI * 2);
            ctx.fillStyle = timeMode === 'night' ? 'rgba(255, 255, 255, 0.06)' : 'rgba(255, 255, 255, 0.28)';
            ctx.fill();

            for (let dx = -r; dx <= r; dx++) {
              for (let dy = -r; dy <= r; dy++) {
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > r + 0.35) continue;

                const gx = isl.gridX + dx;
                const gy = isl.gridY + dy;
                const isShore = dist > r - 0.65;
                const isPeak = dist < 1.35;

                let topC = '#22c55e';
                let leftC = '#16a34a';
                let rightC = '#15803d';
                let blockH = 14;

                if (!isl.unlocked || isl.biome === 'desert') {
                  topC = isShore ? '#fde68a' : '#eab308';
                  leftC = '#ca8a04';
                  rightC = '#a16207';
                  blockH = isShore ? 8 : 13;
                } else if (isShore) {
                  topC = '#fef08a';
                  leftC = '#eab308';
                  rightC = '#ca8a04';
                  blockH = 8;
                } else if (isl.biome === 'snow') {
                  topC = isPeak ? '#ffffff' : '#94a3b8';
                  leftC = isPeak ? '#e2e8f0' : '#64748b';
                  rightC = isPeak ? '#cbd5e1' : '#475569';
                  blockH = isPeak ? 28 : 16;
                } else if (isl.biome === 'mountain') {
                  topC = isPeak ? '#f8fafc' : '#22c55e';
                  leftC = isPeak ? '#cbd5e1' : '#16a34a';
                  rightC = isPeak ? '#94a3b8' : '#15803d';
                  blockH = isPeak ? 34 : 16;
                } else if (isl.biome === 'hub') {
                  topC = isPeak ? '#34d399' : '#4ade80';
                  leftC = '#10b981';
                  rightC = '#059669';
                  blockH = isPeak ? 22 : 14;
                } else if (isl.biome === 'meadow') {
                  topC = isPeak ? '#a3e635' : '#84cc16';
                  leftC = '#65a30d';
                  rightC = '#4d7c0f';
                  blockH = isPeak ? 20 : 13;
                }

                const hash = Math.abs(Math.sin(gx * 12.9898 + gy * 78.233) * 43758.5453) % 1;
                const treeThreshold = (isl.prosperity / 100) * 0.65;
                const hasTree = !isShore && isl.unlocked && hash < treeThreshold;
                const isCenterTower = dx === 0 && dy === 0;

                allTiles.push({
                  gx,
                  gy,
                  depth: gx + gy,
                  topC,
                  leftC,
                  rightC,
                  blockH,
                  hasTree,
                  isCenterTower,
                  island: isl,
                  isEastSlot: dx === 1 && dy === 0,
                  isWestSlot: dx === -1 && dy === 0
                });
              }
            }
          });

          allTiles.sort((a, b) => a.depth - b.depth);

          allTiles.forEach((tile) => {
            const p = isoToScreen(tile.gx, tile.gy);
            const isSelected = tile.island.id === selectedIslandId;
            const isPulsing = tile.island.id === pulseIslandId;
            const bounce = isPulsing ? Math.abs(Math.sin(time * 4)) * 8 : 0;

            ctx.beginPath();
            ctx.ellipse(p.x, p.y + tileH / 2, tileW * 0.56, tileH * 0.56, 0, 0, Math.PI * 2);
            ctx.fillStyle = isSelected ? 'rgba(255, 255, 255, 0.4)' : 'rgba(186, 230, 253, 0.35)';
            ctx.fill();

            drawVoxelBlock(ctx, p.x, p.y - bounce, tileW, tileH, tile.blockH, tile.topC, tile.leftC, tile.rightC);

            if (tile.isCenterTower) {
              const baseTop = p.y - tile.blockH - bounce;
              const isNight = timeMode === 'night' || timeMode === 'aurora';
              if (tile.island.biome === 'hub') {
                drawVoxelBlock(ctx, p.x, baseTop, 24, 12, 18, isNight ? '#fef08a' : '#f8fafc', '#cbd5e1', '#94a3b8', isNight);
                drawVoxelBlock(ctx, p.x, baseTop - 18, 16, 8, 12, '#10b981', '#059669', '#047857', isNight);
              } else if (tile.island.unlocked) {
                drawVoxelBlock(ctx, p.x, baseTop, 18, 9, 14, isNight ? '#fde047' : '#fef3c7', '#f59e0b', '#d97706', isNight);
              }

              if (tile.island.unlocked) {
                const walkCycle = Math.sin(time * 2 + tile.gx) * 8;
                drawVoxelBlock(ctx, p.x + walkCycle, baseTop + 10, 8, 4, 8, '#3b82f6', '#2563eb', '#1d4ed8');
                drawVoxelBlock(ctx, p.x + walkCycle, baseTop + 2, 10, 5, 3, '#0f172a', '#1e293b', '#0f172a');
              }
            } else if (tile.isEastSlot && (tile.island.facilities || []).includes('library')) {
              const baseTop = p.y - tile.blockH - bounce;
              drawVoxelBlock(ctx, p.x, baseTop, 16, 8, 12, '#38bdf8', '#0284c7', '#0369a1');
              drawVoxelBlock(ctx, p.x, baseTop - 12, 12, 6, 6, '#facc15', '#eab308', '#ca8a04');
            } else if (tile.isWestSlot && (tile.island.facilities || []).includes('lab')) {
              const baseTop = p.y - tile.blockH - bounce;
              drawVoxelBlock(ctx, p.x, baseTop, 14, 7, 10, '#f1f5f9', '#cbd5e1', '#94a3b8');
              drawVoxelBlock(ctx, p.x, baseTop - 10, 8, 4, 10, '#10b981', '#059669', '#047857');
            } else if (tile.hasTree) {
              const baseTop = p.y - tile.blockH - bounce;
              drawVoxelBlock(ctx, p.x, baseTop, 8, 4, 8, '#92400e', '#78350f', '#451a03');
              if (tile.island.biome === 'snow') {
                drawVoxelBlock(ctx, p.x, baseTop - 7, 18, 9, 12, '#ffffff', '#e2e8f0', '#cbd5e1');
              } else {
                drawVoxelBlock(ctx, p.x, baseTop - 7, 20, 10, 12, '#16a34a', '#15803d', '#166534');
                drawVoxelBlock(ctx, p.x, baseTop - 16, 12, 6, 8, '#22c55e', '#16a34a', '#15803d');
              }
            }
          });

          // SOROTAN LAMPU MERCUSUAR BERPUTAR SAAT MALAM/BADAI
          if (timeMode === 'night' || timeMode === 'storm' || timeMode === 'aurora') {
            const hubPos = isoToScreen(0, 0);
            const beamAngle = time * 1.5;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(hubPos.x, hubPos.y - 42);
            ctx.arc(hubPos.x, hubPos.y - 42, 280, beamAngle - 0.25, beamAngle + 0.25);
            ctx.closePath();
            const beamGrad = ctx.createRadialGradient(hubPos.x, hubPos.y - 42, 10, hubPos.x, hubPos.y - 42, 280);
            beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
            beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
            ctx.fillStyle = beamGrad;
            ctx.fill();
            ctx.restore();
          }

          // Kabut Misteri
          islands.filter((isl) => !isl.unlocked).forEach((locked) => {
            const p = isoToScreen(locked.gridX, locked.gridY);
            for (let f = 0; f < 4; f++) {
              const fogW = 54 + Math.sin(time * 2 + f) * 8;
              const fogH = 26 + Math.cos(time * 2 + f) * 4;
              const fogOffX = Math.sin(time * 1.5 + f * 1.2) * 16;
              const fogOffY = -24 + Math.cos(time * 1.5 + f * 1.2) * 10;
              ctx.beginPath();
              ctx.ellipse(p.x + fogOffX, p.y + fogOffY, fogW, fogH, 0, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(241, 245, 249, 0.75)';
              ctx.fill();
            }
          });

          // Botol Hanyut
          const newBottleHitboxes = [];
          bottles.forEach((bot) => {
            if (bot.claimed) return;
            const bp = isoToScreen(bot.gridX, bot.gridY);
            const bob = Math.sin(time * 3 + bot.gridX) * 3;
            const botY = bp.y + bob;

            newBottleHitboxes.push({ id: bot.id, x: bp.x, y: botY, r: 20 });

            ctx.beginPath();
            ctx.arc(bp.x, botY + 4, 6 + Math.abs(bob), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();

            drawVoxelBlock(ctx, bp.x, botY, 12, 6, 8, 'rgba(56, 189, 248, 0.85)', 'rgba(14, 165, 233, 0.85)', 'rgba(2, 132, 199, 0.85)', true);
            drawVoxelBlock(ctx, bp.x, botY - 8, 4, 2, 4, '#ca8a04', '#a16207', '#713f12');
          });
          bottleHitboxesRef.current = newBottleHitboxes;

          // Kapal Layar Pemain
          const targetIsland = islands.find((i) => i.id === selectedIslandId) || islands[0];
          const targetIslandPos = isoToScreen(targetIsland.gridX + 1.8, targetIsland.gridY + 1.8);
          const curBx = boatPos.x + (targetIslandPos.x - boatPos.x) * 0.04;
          const curBy = boatPos.y + (targetIslandPos.y - boatPos.y) * 0.04;
          setBoatPos({ x: curBx, y: curBy });

          ctx.beginPath();
          ctx.arc(curBx, curBy + 6, 7 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fill();

          drawVoxelBlock(ctx, curBx, curBy, 18, 9, 7, '#b45309', '#92400e', '#78350f');
          drawVoxelBlock(ctx, curBx, curBy - 7, 4, 2, 14, '#64748b', '#475569', '#334155');
          drawVoxelBlock(ctx, curBx + 3, curBy - 15, 12, 6, 8, '#ffffff', '#f1f5f9', '#e2e8f0');
          drawVoxelBlock(ctx, curBx - 3, curBy - 21, 6, 3, 3, sailColor, sailColor, sailColor);

          if (timeMode === 'storm') {
            ctx.strokeStyle = 'rgba(226, 232, 240, 0.55)';
            ctx.lineWidth = 1.5;
            rainDropsRef.current.forEach((drop) => {
              drop.y += drop.speed;
              if (drop.y > rect.height) drop.y = -20;
              ctx.beginPath();
              ctx.moveTo(drop.x, drop.y);
              ctx.lineTo(drop.x - 3, drop.y + drop.len);
              ctx.stroke();
            });
          }

          const snowCenter = isoToScreen(0, -7);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          snowflakesRef.current.forEach((flake) => {
            flake.y += flake.speed;
            if (flake.y > -20) flake.y = -140 - Math.random() * 40;
            ctx.beginPath();
            ctx.arc(snowCenter.x + flake.x, snowCenter.y + flake.y, flake.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          if (timeMode === 'night' || timeMode === 'aurora') {
            firefliesRef.current.forEach((fly) => {
              fly.phase += fly.speed;
              const fp = isoToScreen(fly.gx, fly.gy);
              const fx = fp.x + Math.sin(fly.phase) * 24;
              const fy = fp.y + fly.offsetY + Math.cos(fly.phase * 1.5) * 12;
              const glowAlpha = (Math.sin(fly.phase * 3) + 1) * 0.4 + 0.2;
              ctx.fillStyle = `rgba(110, 231, 183, ${glowAlpha})`;
              ctx.beginPath();
              ctx.arc(fx, fy, 2.2, 0, Math.PI * 2);
              ctx.fill();
            });
          }

          if (burstParticlesRef.current.length > 0) {
            burstParticlesRef.current.forEach((p) => {
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.2;
              p.alpha -= 0.018;
              ctx.save();
              ctx.globalAlpha = Math.max(0, p.alpha);
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            });
            burstParticlesRef.current = burstParticlesRef.current.filter((p) => p.alpha > 0);
          }

          // Label Pulau
          islands.forEach((isl) => {
            const p = isoToScreen(isl.gridX, isl.gridY);
            const labelY = p.y - 48;
            const isSelected = isl.id === selectedIslandId;

            ctx.font = '700 12px "Plus Jakarta Sans", sans-serif';
            const titleWidth = ctx.measureText(isl.name).width;
            ctx.font = '500 10px "Plus Jakarta Sans", sans-serif';
            const subText = isl.unlocked ? `• ${isl.subtitle}` : '🔒 Kabut Misteri (Klik Kuis)';
            const subWidth = ctx.measureText(subText).width;

            const boxW = Math.max(titleWidth, subWidth) + 26;
            const boxH = 38;
            const boxX = p.x - boxW / 2;
            const boxY = labelY - boxH / 2;

            ctx.fillStyle = isSelected ? 'rgba(16, 185, 129, 0.96)' : 'rgba(15, 23, 42, 0.88)';
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 10);
            ctx.fill();

            if (isSelected) {
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 2;
              ctx.stroke();
            }

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = '700 11.5px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(isl.name, p.x, boxY + 16);

            ctx.fillStyle = isSelected ? '#ecfdf5' : isl.unlocked ? '#6ee7b7' : '#fde047';
            ctx.font = '600 9.5px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(subText, p.x, boxY + 30);
          });

          hitboxesRef.current = newHitboxes;
          ctx.restore();

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animationFrameId);
      }, [islands, selectedIslandId, camera, pulseIslandId, timeMode, boatPos, setBoatPos, bottles, drawVoxelBlock, sailColor]);

      // MOUSE / TOUCH GESTURES
      const handlePointerDown = (e) => {
        isDraggingRef.current = true;
        movedDistanceRef.current = 0;
        dragStartRef.current = { x: e.clientX - camera.x, y: e.clientY - camera.y };
      };

      const handlePointerMove = (e) => {
        if (!isDraggingRef.current) return;
        const nextX = e.clientX - dragStartRef.current.x;
        const nextY = e.clientY - dragStartRef.current.y;
        movedDistanceRef.current += Math.abs(nextX - camera.x) + Math.abs(nextY - camera.y);
        setCamera((prev) => ({
          ...prev,
          x: Math.max(-600, Math.min(600, nextX)),
          y: Math.max(-500, Math.min(500, nextY))
        }));
      };

      const handlePointerUp = (e) => {
        if (!isDraggingRef.current) return;
        isDraggingRef.current = false;

        if (movedDistanceRef.current < 8 && canvasRef.current) {
          const rect = canvasRef.current.getBoundingClientRect();
          const worldX = (e.clientX - rect.left - rect.width / 2 - camera.x) / camera.zoom;
          const worldY = (e.clientY - rect.top - rect.height / 2 - camera.y) / camera.zoom;

          for (const bh of bottleHitboxesRef.current) {
            if (Math.hypot(worldX - bh.x, worldY - bh.y) <= bh.r) {
              soundManager.playCoin();
              onSelectBottle(bh.id);
              return;
            }
          }

          for (const hb of hitboxesRef.current) {
            if (Math.hypot(worldX - hb.x, worldY - hb.y) <= hb.hitRadius) {
              soundManager.playClick();
              onSelectIsland(hb.id);
              break;
            }
          }
        }
      };

      const handleTouchStart = (e) => {
        if (e.touches.length === 2) {
          touchDistRef.current = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      };

      const handleTouchMove = (e) => {
        if (e.touches.length === 2 && touchDistRef.current) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const diff = (currentDist - touchDistRef.current) * 0.005;
          setCamera((prev) => ({
            ...prev,
            zoom: Math.max(0.6, Math.min(1.8, Number((prev.zoom + diff).toFixed(2))))
          }));
          touchDistRef.current = currentDist;
        }
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.12 : -0.12;
        setCamera((prev) => ({
          ...prev,
          zoom: Math.max(0.6, Math.min(1.8, Number((prev.zoom + delta).toFixed(2))))
        }));
      };

      return (
        <canvas
          ref={canvasRef}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerLeave={handlePointerUp}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={() => { touchDistRef.current = null; }}
          onWheel={handleWheel}
          aria-label="Peta Dunia EdTech World"
          className="w-full h-full block cursor-grab active:cursor-grabbing touch-none"
        />
      );
    }

    // ========================================================================
    // GLOBAL SEARCH BAR & ENSIKLOPEDIA TEORI
    // ========================================================================
    function GlobalSearchBar({ islands, onSelectIsland, flyToIsland }) {
      const [query, setQuery] = useState('');
      const [isOpen, setIsOpen] = useState(false);

      const results = useMemo(() => {
        if (!query.trim() || query.length < 2) return [];
        const q = query.toLowerCase();
        const matches = [];

        islands.forEach((isl) => {
          if (isl.name.toLowerCase().includes(q) || isl.course.toLowerCase().includes(q) || isl.summary.toLowerCase().includes(q)) {
            matches.push({ type: 'Kawasan', title: isl.name, sub: isl.course, islandId: isl.id });
          }
          (isl.concepts || []).forEach((c) => {
            if (c.toLowerCase().includes(q)) {
              matches.push({ type: 'Konsep', title: c.split(':')[0], sub: isl.name, islandId: isl.id });
            }
          });
        });
        return matches.slice(0, 5);
      }, [query, islands]);

      return (
        <div className="relative w-64 md:w-80">
          <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900/90 backdrop-blur-md border border-white/15 text-white shadow-lg">
            <Icon name="Search" className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
            <input
              type="text"
              placeholder="Cari materi / teori (ADDIE, Mayer, TPACK)..."
              value={query}
              onChange={(e) => {
                setQuery(e.target.value);
                setIsOpen(true);
              }}
              onFocus={() => setIsOpen(true)}
              className="w-full bg-transparent text-xs text-white placeholder-slate-400 focus:outline-none"
            />
            {query && (
              <button onClick={() => { setQuery(''); setIsOpen(false); }} className="text-slate-400 hover:text-white">
                <Icon name="X" className="w-3.5 h-3.5" />
              </button>
            )}
          </div>

          {isOpen && results.length > 0 && (
            <div className="absolute top-full left-0 right-0 mt-1.5 p-2 rounded-2xl bg-slate-900/95 backdrop-blur-xl border border-white/20 shadow-2xl z-50 space-y-1">
              {results.map((res, idx) => (
                <button
                  key={idx}
                  onClick={() => {
                    flyToIsland(res.islandId);
                    onSelectIsland(res.islandId);
                    setIsOpen(false);
                    setQuery('');
                  }}
                  className="w-full text-left p-2 rounded-xl hover:bg-white/10 transition-colors flex items-center justify-between gap-2 cursor-pointer"
                >
                  <div className="min-w-0">
                    <div className="text-xs font-bold text-white truncate">{res.title}</div>
                    <div className="text-[10px] text-emerald-400 truncate">{res.sub}</div>
                  </div>
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 shrink-0">
                    {res.type}
                  </span>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

      // 2. Auto-Save ke LocalStorage

        try {
          const payload = {

            dayStreak,
            xp,
            citizens,
            passportId,
            lastVisit,
            islands,
            quests,
            skillTree,
            bottles,
            poll,
            votedOptionId,
            alunMessages,
            sailColor,
            masteredCards
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (_) {}
      }, [playerName, dayStreak, xp, citizens, passportId, lastVisit, islands, quests, skillTree, bottles, poll, votedOptionId, alunMessages, sailColor, masteredCards]);

      // Kontrol Suara Hujan Real-time saat Badai atau Arena

      // LOGIKA TUR SINEMATIK OTOMATIS

          x: -currentTourIsland.gridX * 15,

        return () => clearTimeout(tourTimer);

      const growIslandProsperity = useCallback((islandId, prosperityGain, xpGain, citizensGain, reason) => {

          prev.map((isl) => {

            const cleanName = isl.name.replace(' ?', '');

              subtitle: isl.unlocked ? isl.subtitle : 'Kawasan Terbuka',
              biome: isl.biome === 'desert' ? 'forest' : isl.biome,
              unlocked: true,
              prosperity: Math.min(100, isl.prosperity + prosperityGain)

          })

        setXp((prev) => prev + xpGain);

        setPulseIslandId(islandId);
        setBurstTrigger({ x: 0, y: -20, t: Date.now() });
        soundManager.playVictory();
        triggerToast(`+${xpGain} XP & +${citizensGain} Penduduk! ${reason}`);

      const handleBuildFacility = (islandId, facilityType, costXp, name) => {
        if (xp < costXp) {
          triggerToast(`XP belum mencukupi (Butuh ${costXp} XP)!`);
          return;

        setXp((x) => x - costXp);
        setIslands((prev) =>
          prev.map((isl) => {
            if (isl.id !== islandId) return isl;
            const curFac = isl.facilities || [];
            if (curFac.includes(facilityType)) return isl;
            return {
              ...isl,
              facilities: [...curFac, facilityType],
              prosperity: Math.min(100, isl.prosperity + 15)
            };
          })
        );
        soundManager.playBuild();
        triggerToast(`Fasilitas ${name} berhasil dibangun di pulau!`);
      };

        if (xp < costXp) {
          triggerToast(`XP belum cukup (${xp}/${costXp} XP)`);
          return;

        setXp((x) => x - costXp);

        soundManager.playVictory();

          prev.map((q) => (q.id === quest.id ? { ...q, done: true, completedMinutes: q.estimatedMinutes } : q))

      const handleVote = (optionId) => {
        if (votedOptionId) return;
        setVotedOptionId(optionId);
        setPoll((prev) => ({
          ...prev,
          options: prev.options.map((o) => (o.id === optionId ? { ...o, votes: o.votes + 1 } : o))

                className="px-3 py-2 rounded-xl bg-white/95 hover:bg-white backdrop-blur-md border border-slate-200 shadow-md text-center cursor-pointer"

                <div className="text-[10px] font-semibold text-slate-500 mt-1 flex items-center justify-center gap-1">
                  <Icon name="Award" className="w-3 h-3 text-amber-600" />
                  <span>{xp} XP</span>
                </div>
              </button>

              {/* TOMBOL BGM LO-FI */}
              <button
                onClick={toggleBgm}
                title="Putar Musik Latar Lo-Fi Belajar"

                  isBgmOn ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-white/95 text-slate-700 border-slate-200'

                <span>{isBgmOn ? '🎵 BGM: ON' : '🔈 BGM: OFF'}</span>
              </button>
            </div>

            {/* PENCARIAN TEORI GLOBAL */}
            <GlobalSearchBar
              islands={islands}
              onSelectIsland={(id) => {
                setSelectedIslandId(id);
                setActiveModal('island');
              }}
              flyToIsland={flyToIsland}
            />
          </div>

          {/* KONTROL KANAN ATAS */}
          <div className="fixed top-3.5 right-3.5 z-20 flex items-center gap-2">
            <button
              onClick={startTour}
              title="Mulai Tur Sinematik Otomatis"
              className="px-3 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-extrabold text-xs shadow-lg cursor-pointer flex items-center gap-1.5"
            >
              <span>🎬 Tur Kampus</span>
            </button>

            <button
              onClick={cycleWeather}
              title="Ganti Cuaca Dunia"
              className="px-3 py-2 rounded-xl bg-slate-900/90 text-white border border-white/10 hover:bg-slate-800 shadow-lg cursor-pointer flex items-center gap-1.5 text-xs font-bold"
            >
              {timeMode === 'day' ? '☀️ Siang' : timeMode === 'sunset' ? '🌅 Senja' : timeMode === 'night' ? '🌙 Malam' : timeMode === 'storm' ? '⛈️ Badai' : '🌌 Aurora'}
            </button>

            <button
              onClick={toggleMute}
              className="p-2.5 rounded-xl bg-slate-900/90 text-white border border-white/10 hover:bg-slate-800 shadow-lg cursor-pointer"
            >
              <Icon name={isMuted ? 'VolumeX' : 'Volume2'} className="w-4 h-4" />
            </button>

            <button
              onClick={() => setActiveModal('menu')}
              className="px-3.5 py-2.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 text-white text-xs font-bold shadow-lg border border-white/10 flex items-center gap-2 cursor-pointer"
            >
              <Icon name="Menu" className="w-4 h-4 text-emerald-400" />
              <span>Menu</span>
            </button>
          </div>

          {/* TOMBOL KONTROL KAMERA KANAN TENGAH */}
          <div className="fixed right-3.5 bottom-28 z-20">
            <CameraControls camera={camera} setCamera={setCamera} />
          </div>

          {/* RADAR MINIMAP KIRI BAWAH */}
          <div className="fixed bottom-24 left-3.5 z-20 hidden md:block">
            <MiniMapRadar
              islands={islands}
              selectedIslandId={selectedIslandId}
              onSelectIsland={flyToIsland}
              camera={camera}
              timeMode={timeMode}
            />
          </div>

          {/* OVERLAY DOCK BAWAH LENGKAP */}
          <div className="fixed bottom-3 inset-x-0 z-20 flex flex-col items-center px-3 pointer-events-none gap-2">
            {/* WIDGET POLLING DEWAN */}
            <div className="pointer-events-auto w-full max-w-md px-3.5 py-2 rounded-xl bg-white/95 backdrop-blur-md border border-slate-200 shadow-lg flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                <Icon name="Vote" className="w-4 h-4 text-indigo-600 shrink-0" />
                <p className="text-[11px] text-slate-700 truncate">
                  <span className="text-slate-400 font-semibold">Dewan: </span>
                  <strong className="text-slate-900">{poll.question}</strong>
                </p>
              </div>
              <button
                onClick={() => setActiveModal('voting')}
                className="shrink-0 px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-[11px] cursor-pointer"
              >
                {votedOptionId ? 'Hasil ›' : 'Ikut ›'}
              </button>
            </div>

            {/* NAVIGASI DOCK UTAMA LENGKAP */}
            <nav
              aria-label="Navigasi Utama"
              className="pointer-events-auto bg-slate-900/95 backdrop-blur-xl p-1.5 rounded-2xl border border-white/15 shadow-2xl flex items-center gap-1 sm:gap-1.5 overflow-x-auto max-w-full"
            >
              {[
                { id: 'none', label: 'Peta', icon: 'Map' },
                { id: 'island', label: 'Kawasan', icon: 'BookOpen' },
                { id: 'bloom', label: 'Piramida Bloom', icon: 'Flame' },
                { id: 'assureMatcher', label: 'Simulasi ASSURE', icon: 'Sliders' },
                { id: 'flashcards', label: 'Flashcards', icon: 'Layers' },
                { id: 'sorter', label: 'Pemilah CLT', icon: 'Sliders' },
                { id: 'alun', label: 'Alun-Alun', icon: 'Users' },
                { id: 'wizard', label: 'Modul Ajar', icon: 'FileSpreadsheet' },
                { id: 'boss', label: 'Boss Battle', icon: 'Flame' },
                { id: 'mentor', label: 'Prof. Voxel', icon: 'Sparkles' },
                { id: 'arena', label: 'Arena Fokus', icon: 'Timer' },
                { id: 'paspor', label: 'Paspor & ID', icon: 'IdCard' }
              ].map((nav) => {
                const isActive = activeModal === nav.id;
                return (
                  <button
                    key={nav.id}
                    onClick={() => {
                      if (isTourActive) stopTour();
                      soundManager.playClick();
                      setActiveModal(nav.id);
                    }}
                    className={`flex flex-col items-center justify-center px-2.5 py-1.5 rounded-xl text-[10px] font-bold transition-all min-w-[50px] cursor-pointer ${
                      isActive ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30' : 'text-slate-300 hover:bg-white/10 hover:text-white'
                    }`}
                  >
                    <Icon name={nav.icon} className="w-4 h-4 mb-0.5" />
                    <span>{nav.label}</span>
                  </button>
                );
              })}
            </nav>
          </div>

          {/* ======================================================================== */}
          {/* DAFTAR MODAL INTERAKTIF */}
          {/* ======================================================================== */}

          {/* MODAL 1: DETAIL KAWASAN + FASILITAS & MULTI-KUIS */}
          {activeModal === 'island' && (
            <EnhancedIslandDetailModal
              island={selectedIsland}
              quests={quests.filter((q) => q.islandId === selectedIsland.id)}
              onClose={() => setActiveModal('none')}
              onCompleteQuest={handleCompleteQuest}
              onStartArena={(qId) => {
                setArenaQuestId(qId);
                setActiveModal('arena');
              }}
              onPassQuiz={() => {
                growIslandProsperity(selectedIsland.id, 25, 40, 90, `Kuis kawasan "${selectedIsland.name}" berhasil dijawab!`);
              }}
              onUnlockIsland={() => {
                growIslandProsperity(selectedIsland.id, 40, 100, 200, `Kabut misteri di kawasan "${selectedIsland.name}" berhasil disingkap!`);
              }}
              onBuildFacility={(type, cost, name) => handleBuildFacility(selectedIsland.id, type, cost, name)}
              userXp={xp}
            />
          )}

          {/* MODAL 2: MINI-GAME MENARA PIRAMIDA TAKSONOMI BLOOM (C1-C6) */}
          {activeModal === 'bloom' && (
            <BloomPyramidModal
              onSuccess={(earnedXp) => {
                setXp((x) => x + earnedXp);
                setCitizens((c) => c + 180);
                soundManager.playVictory();
                triggerToast(`Piramida Taksonomi Bloom Berhasil Dibangun! (+${earnedXp} XP)`);
              }}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 3: SIMULATOR PEMILIHAN MEDIA ASSURE */}
          {activeModal === 'assureMatcher' && (
            <AssureMatcherModal
              onSuccess={(earnedXp) => {
                setXp((x) => x + earnedXp);
                setCitizens((c) => c + 150);
                soundManager.playVictory();
                triggerToast(`Simulasi Pemilihan Media ASSURE Selesai! (+${earnedXp} XP)`);
              }}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 4: POHON KETERAMPILAN (SKILL TREE) */}
          {activeModal === 'skills' && (
            <SkillTreeModal
              skillTree={skillTree}
              userXp={xp}
              onUnlockSkill={handleUnlockSkill}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 5: FLASHCARDS TEORI TEKPEND */}
          {activeModal === 'flashcards' && (
            <FlashcardsModal
              masteredCards={masteredCards}
              onMarkMastered={(id) => {
                if (!masteredCards.includes(id)) {
                  setMasteredCards((prev) => [...prev, id]);
                  setXp((x) => x + 15);
                  soundManager.playCoin();
                  triggerToast('Konsep dikuasai! (+15 XP)');
                }
              }}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 6: MINI-GAME PEMILAH BEBAN KOGNITIF (CLT SORTER) */}
          {activeModal === 'sorter' && (
            <CognitiveLoadSorterModal
              onSuccess={(earnedXp) => {
                setXp((x) => x + earnedXp);
                setCitizens((c) => c + 150);
                soundManager.playVictory();
                triggerToast(`Hebat! Mini-game tuntas! (+${earnedXp} XP)`);
              }}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 7: ALUN-ALUN KOMUNITAS */}
          {activeModal === 'alun' && (
            <AlunAlunModal
              messages={alunMessages}
              onPostMessage={handleAddAlunMessage}
              onLikeMessage={handleLikeAlunMessage}
              playerName={playerName}
              islands={islands}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 8: WIZARD MODUL AJAR (KURIKULUM MERDEKA & ADDIE) */}
          {activeModal === 'wizard' && (
            <AddieProjectWizardModal
              onClose={() => setActiveModal('none')}
              onSaveProject={(proj) => {
                setXp((x) => x + 75);
                soundManager.playVictory();
                triggerToast('Modul Ajar berhasil dirancang & disimpan! (+75 XP)');
              }}
            />
          )}

          {/* MODAL 9: BOSS BATTLE */}
          {activeModal === 'boss' && (
            <BossBattleModal
              onClose={() => setActiveModal('none')}
              onDefeatBoss={() => {
                setXp((x) => x + 150);
                setCitizens((c) => c + 300);
                soundManager.playVictory();
                triggerToast('Luar Biasa! Monster Beban Kognitif berhasil ditaklukkan! (+150 XP)');
              }}
            />
          )}

          {/* MODAL 10: MENTOR AI PROF. VOXEL DENGAN SUARA NARATOR */}
          {activeModal === 'mentor' && (
            <ProfVoxelMentorModal onClose={() => setActiveModal('none')} />
          )}

          {/* MODAL 11: BOTOL HANYUT DENGAN SUARA NARASI TOKOH */}
          {activeModal === 'bottle' && activeBottle && (
            <BottleMessageModal
              bottle={activeBottle}
              onClaim={() => handleClaimBottle(activeBottle.id)}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 12: PASPOR & KARTU MAHASISWA QR CODE */}
          {activeModal === 'paspor' && (
            <PasporModal
              playerName={playerName}
              setPlayerName={setPlayerName}
              passportId={passportId}
              dayStreak={dayStreak}
              xp={xp}
              levelNumber={levelNumber}
              citizens={citizens}
              islands={islands}
              sailColor={sailColor}
              setSailColor={setSailColor}
              onOpenCertificate={() => setActiveModal('certificate')}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 13: SERTIFIKAT KELULUSAN */}
          {activeModal === 'certificate' && (
            <CertificateModal
              playerName={playerName}
              passportId={passportId}
              levelNumber={levelNumber}
              xp={xp}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 14: MISI KAWASAN */}
          {activeModal === 'misi' && (
            <MisiAddieModal
              quests={quests}
              islands={islands}
              onClose={() => setActiveModal('none')}
              onCompleteQuest={handleCompleteQuest}
              onStartArena={(qId) => {
                setArenaQuestId(qId);
                setActiveModal('arena');
              }}
            />
          )}

          {/* MODAL 15: ARENA FOKUS DENGAN SUARA HUJAN SYNTH */}
          {activeModal === 'arena' && (
            <ArenaFokusModal
              quests={quests}
              islands={islands}
              arenaQuestId={arenaQuestId}
              setArenaQuestId={setArenaQuestId}
              arenaPresetMins={arenaPresetMins}
              setArenaPresetMins={(m) => {
                setArenaRunning(false);
                setArenaPresetMins(m);
                setArenaSeconds(m * 60);
              }}
              arenaSeconds={arenaSeconds}
              setArenaSeconds={setArenaSeconds}
              arenaRunning={arenaRunning}
              setArenaRunning={setArenaRunning}
              rainSoundOn={rainSoundOn}
              setRainSoundOn={setRainSoundOn}
              onManualFinish={() => {
                setArenaRunning(false);
                const q = quests.find((item) => item.id === arenaQuestId);
                if (q) {
                  setQuests((all) =>
                    all.map((item) => (item.id === q.id ? { ...item, completedMinutes: item.completedMinutes + arenaPresetMins } : item))
                  );
                  growIslandProsperity(q.islandId, 15, 35, 65, 'Sesi fokus menumbuhkan pepohonan pulau!');
                }
                setArenaSeconds(arenaPresetMins * 60);
              }}
              onClose={() => setActiveModal('none')}
            />
          )}

          {/* MODAL 16: DEWAN VOTING */}
          {activeModal === 'voting' && (
            <VotingModal poll={poll} votedOptionId={votedOptionId} onVote={handleVote} onClose={() => setActiveModal('none')} />
          )}

          {/* MODAL 17: MENU UTAMA */}
          {activeModal === 'menu' && (
            <MenuModal
              onResetProgress={handleResetAllProgress}
              onOpenFeature={(modalName) => setActiveModal(modalName)}
              onStartTour={startTour}
              onClose={() => setActiveModal('none')}
            />
          )}
        </div>
      );
    }

    // ========================================================================
    // MODAL: DETAIL KAWASAN + FASILITAS, MULTI-KUIS & TEKA-TEKI BUKA KABUT
    // ========================================================================
    function EnhancedIslandDetailModal({ island, quests, onClose, onCompleteQuest, onStartArena, onPassQuiz, onUnlockIsland, onBuildFacility, userXp }) {
      const [tab, setTab] = useState('summary');
      const [selectedQuizIdx, setSelectedQuizIdx] = useState(0);
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [quizAnswered, setQuizAnswered] = useState(false);

      const quizList = island.quizzes || [];
      const curQuiz = quizList[selectedQuizIdx] || quizList[0];

      const handleCheckQuiz = () => {
        if (selectedOpt === null || quizAnswered || !curQuiz) return;
        setQuizAnswered(true);
        if (selectedOpt === curQuiz.ans) {
          if (!island.unlocked) {
            onUnlockIsland();
          } else {
            onPassQuiz();
          }
        }
      };

      const facilities = island.facilities || [];

      return (
        <div role="dialog" className="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="w-full max-w-lg rounded-3xl bg-white shadow-2xl border border-slate-200 overflow-hidden max-h-[88vh] flex flex-col">
            <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between shrink-0">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">{island.course}</span>
                <h2 className="font-extrabold text-base">{island.name}</h2>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/10 cursor-pointer">
                <Icon name="X" className="w-4 h-4" />
              </button>
            </div>

            <div className="flex border-b border-slate-200 px-6 pt-2 bg-slate-50 text-xs font-bold gap-4 overflow-x-auto">
              <button onClick={() => setTab('summary')} className={`py-2.5 border-b-2 cursor-pointer ${tab === 'summary' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500'}`}>
                📖 Teori
              </button>
              <button onClick={() => setTab('build')} className={`py-2.5 border-b-2 cursor-pointer ${tab === 'build' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500'}`}>
                🏗️ Fasilitas
              </button>
              <button onClick={() => setTab('quiz')} className={`py-2.5 border-b-2 cursor-pointer ${tab === 'quiz' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500'}`}>
                ⭐ Kuis ({quizList.length})
              </button>
              <button onClick={() => setTab('quests')} className={`py-2.5 border-b-2 cursor-pointer ${tab === 'quests' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500'}`}>
                🎯 Misi ({quests.length})
              </button>
            </div>

            <div className="p-6 overflow-y-auto space-y-4 text-xs">
              {tab === 'summary' && (
                <div className="space-y-4">
                  {!island.unlocked && (
                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-300 text-amber-900 space-y-2">
                      <div className="font-extrabold flex items-center gap-1.5">
                        <span>🔒 Kawasan Terhalang Kabut Misteri</span>
                      </div>
                      <p className="text-[11px] leading-relaxed">
                        Selesaikan tantangan kuis di tab <strong>⭐ Kuis</strong> untuk memecahkan sandi kurikulum dan menyingkap kabut kawasan ini secara permanen!
                      </p>
                    </div>
                  )}

                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                    <div className="flex items-center justify-between font-bold mb-1.5">
                      <span className="text-slate-700">Tingkat Kemakmuran Pulau</span>
                      <span className="text-emerald-600">{island.prosperity}%</span>
                    </div>
                    <div className="w-full h-2.5 rounded-full bg-slate-200 overflow-hidden">
                      <div className="h-full rounded-full bg-gradient-to-r from-emerald-500 to-teal-400" style={{ width: `${island.prosperity}%` }} />
                    </div>
                    <p className="text-slate-600 mt-2.5 leading-relaxed">{island.summary}</p>
                  </div>

                  {island.concepts && (
                    <div className="space-y-2">
                      <h4 className="font-bold text-slate-900">Konsep Kunci:</h4>
                      {island.concepts.map((concept, idx) => (
                        <div key={idx} className="p-3 rounded-xl bg-indigo-50/60 border border-indigo-100 text-slate-800 leading-relaxed">
                          {concept}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {tab === 'build' && (
                <div className="space-y-3">
                  <p className="text-slate-500">Bangun fasilitas di pulau ini untuk meningkatkan kemakmuran dan menumbuhkan peradaban belajar:</p>

                  <div className="p-3.5 rounded-2xl border flex items-center justify-between">
                    <div>
                      <h4 className="font-bold text-slate-900">📚 Perpustakaan Digital Voxel</h4>
                      <p className="text-[11px] text-slate-500">Meningkatkan kemakmuran pulau +15%</p>
                    </div>
                    {facilities.includes('library') ? (
                      <span className="text-emerald-600 font-bold">✓ Sudah Dibangun</span>
                    ) : (
                      <button
                        onClick={() => onBuildFacility('library', 50, 'Perpustakaan Digital')}
                        className="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold cursor-pointer hover:bg-indigo-700"
                      >
                        Bangun (50 XP)
                      </button>
                    )}
                  </div>

                  <div className="p-3.5 rounded-2xl border flex items-center justify-between">
                    <div>
                      <h4 className="font-bold text-slate-900">💻 Laboratorium Komputer AI</h4>
                      <p className="text-[11px] text-slate-500">Pusat pengembangan multimedia interaktif (+15%)</p>
                    </div>
                    {facilities.includes('lab') ? (
                      <span className="text-emerald-600 font-bold">✓ Sudah Dibangun</span>
                    ) : (
                      <button
                        onClick={() => onBuildFacility('lab', 80, 'Laboratorium Komputer')}
                        className="px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold cursor-pointer hover:bg-indigo-700"
                      >
                        Bangun (80 XP)
                      </button>
                    )}
                  </div>
                </div>
              )}

              {tab === 'quiz' && curQuiz && (
                <div className="p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-3">
                  <div className="flex items-center justify-between font-bold text-indigo-950">
                    <span>Soal {selectedQuizIdx + 1} dari {quizList.length}</span>
                    <span className="text-xs text-indigo-600">{!island.unlocked ? '🔓 Buka Kawasan (+100 XP)' : '+40 XP'}</span>
                  </div>
                  <p className="font-semibold text-slate-800 text-sm">{curQuiz.q}</p>
                  <div className="space-y-2">
                    {curQuiz.opts.map((opt, idx) => {
                      const isPicked = selectedOpt === idx;
                      let btnStyle = 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50';
                      if (quizAnswered) {
                        if (idx === curQuiz.ans) btnStyle = 'bg-emerald-500 text-white border-emerald-600 font-bold';
                        else if (isPicked) btnStyle = 'bg-rose-500 text-white border-rose-600';
                      } else if (isPicked) {
                        btnStyle = 'bg-indigo-600 text-white border-indigo-600 font-semibold';
                      }
                      return (
                        <button key={idx} onClick={() => !quizAnswered && setSelectedOpt(idx)} className={`w-full text-left px-3.5 py-2.5 rounded-xl border cursor-pointer ${btnStyle}`}>
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                  {!quizAnswered ? (
                    <button onClick={handleCheckQuiz} disabled={selectedOpt === null} className="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold cursor-pointer disabled:opacity-40">
                      Periksa Jawaban
                    </button>
                  ) : (
                    <div className="flex items-center justify-between pt-2">
                      <p className="font-bold text-emerald-700">
                        {selectedOpt === curQuiz.ans ? (island.unlocked ? 'Benar sekali! (+40 XP)' : 'Luar biasa! Kabut terpecahkan dan kawasan terbuka!') : 'Belum tepat, coba pahami kembali materinya!'}
                      </p>
                      {selectedQuizIdx < quizList.length - 1 && (
                        <button onClick={() => { setSelectedQuizIdx(selectedQuizIdx + 1); setSelectedOpt(null); setQuizAnswered(false); }} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold text-xs">
                          Soal Berikutnya →
                        </button>
                      )}
                    </div>
                  )}
                </div>
              )}

              {tab === 'quests' && (
                <div className="space-y-2">
                  {quests.map((q) => (
                    <div key={q.id} className="p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-3">
                      <div className="min-w-0">

    // ========================================================================
    // MODAL: MINI-GAME MENARA PIRAMIDA TAKSONOMI BLOOM (C1-C6)
    // ========================================================================
    function BloomPyramidModal({ onSuccess, onClose }) {
      const [curTierIdx, setCurTierIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [gameOver, setGameOver] = useState(false);

      const tier = BLOOM_TIERS[curTierIdx];

      // KKO options to pick from
      const options = useMemo(() => {
        const pool = [
          { text: tier.target, correct: true },
          { text: 'Menghafal tanpa memahami konteks', correct: false },
          { text: 'Menjiplak karya orang lain tanpa refleksi', correct: false }
        ];
        return pool.sort(() => Math.random() - 0.5);
      }, [tier]);

      const handlePick = (isCorrect) => {
        if (feedback) return;
        if (isCorrect) {
          soundManager.playCoin();
          setScore((s) => s + 1);
          setFeedback({ isCorrect: true, text: `Tepat! Tingkat ${tier.level} (${tier.name}) tercapai!` });
        } else {
          soundManager.playThunder();
          setFeedback({ isCorrect: false, text: `Kurang tepat! Tingkat ${tier.level} berfokus pada aktivitas kognitif tingkat lanjut.` });
        }
      };

      const handleNext = () => {
        setFeedback(null);
        if (curTierIdx < BLOOM_TIERS.length - 1) {
          setCurTierIdx(curTierIdx + 1);
        } else {
          setGameOver(true);
          onSuccess(score * 25 + 50);
        }
      };

      return (
        <div role="dialog" className="fixed inset-0 z-40 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="w-full max-w-lg rounded-3xl bg-white shadow-2xl border border-slate-200 p-6 space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">🏛️</span>
                <h3 className="font-extrabold text-sm">Menara Piramida Taksonomi Bloom</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:bg-slate-100 cursor-pointer">
                <Icon name="X" className="w-4 h-4" />
              </button>
            </div>

            {!gameOver ? (
              <div className="space-y-4 text-xs">
                {/* Visual Piramida Tingkat */}
                <div className="flex flex-col items-center gap-1 py-2">
                  {BLOOM_TIERS.map((t, idx) => (
                    <div
                      key={t.level}
                      style={{
                        width: `${40 + (BLOOM_TIERS.length - 1 - idx) * 11}%`,
                        backgroundColor: idx === curTierIdx ? t.color : idx < curTierIdx ? '#10b981' : '#cbd5e1'
                      }}
                      className="py-1.5 px-3 rounded-lg text-white font-extrabold text-[10px] text-center shadow-xs transition-all"
                    >
                      {t.level}: {t.name} {idx < curTierIdx ? '✓' : idx === curTierIdx ? '⚡' : ''}
                    </div>
                  ))}
                </div>

                <div className="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 text-slate-800 font-semibold leading-relaxed">
                  Pilih deskripsi Kata Kerja Operasional (KKO) yang paling tepat untuk mengisi lantai <strong>{tier.level} — {tier.name}</strong>:
                </div>

                <div className="space-y-2">
                  {options.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => handlePick(opt.correct)}
                      disabled={Boolean(feedback)}
                      className="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-indigo-50 font-semibold text-xs cursor-pointer"
                    >
                      {opt.text}
                    </button>
                  ))}
                </div>

                {feedback && (
                  <div className={`p-3.5 rounded-2xl border space-y-2 ${feedback.isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                    <div className="font-extrabold">{feedback.isCorrect ? '✓ Jawaban Tepat!' : '✗ Kurang Tepat!'}</div>
                    <p className="text-[11px] leading-relaxed">{feedback.text}</p>
                    <button onClick={handleNext} className="mt-1 px-4 py-1.5 rounded-xl bg-slate-900 text-white font-bold cursor-pointer">
                      Lanjut Tingkat Berikutnya →
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="text-center py-6 space-y-3">
                <div className="text-4xl">🏛️🏆</div>
                <h4 className="font-extrabold text-base text-slate-900">PIRAMIDA BLOOM TUNTAS DIBANGUN!</h4>
                <p className="text-xs text-slate-600">
                  Kamu telah menuntaskan simulasi taksonomi dari C1 hingga C6 dengan skor <strong>{score}/{BLOOM_TIERS.length}</strong>!
                </p>
                <button onClick={onClose} className="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold text-xs cursor-pointer">
                  Selesai
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

          soundManager.playCoin();
          setScore((s) => s + 1);

          setGameOver(true);
          onSuccess(score * 35 + 50);

            {!gameOver ? (
              <div className="space-y-4 text-xs">
                <div className="flex justify-between font-bold text-slate-500">
                  <span>Studi Kasus {curCaseIdx + 1} dari {ASSURE_CASES.length}</span>
                  <span className="text-emerald-600">Skor: {score} Benar</span>
                </div>

                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">

                    if (isAnswered) {
                      if (opt.correct) btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-bold';

                    return (
                      <button

                {isAnswered && (
                  <div className={`p-3.5 rounded-2xl border space-y-2 ${curCase.options[pickedOpt].correct ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                    <div className="font-extrabold">{curCase.options[pickedOpt].correct ? '✓ Analisis ASSURE Sangat Tepat!' : '✗ Analisis Kurang Tepat!'}</div>
                    <p className="text-[11px] leading-relaxed">{curCase.options[pickedOpt].reason}</p>

            ) : (

                <p className="text-xs text-slate-600">
                  Kamu berhasil menyelesaikan seluruh analisis pemilihan media dengan skor <strong>{score}/{ASSURE_CASES.length}</strong>!

    // MODAL: SERTIFIKAT KELULUSAN TEKPEND (CANVAS SNAPSHOT & PNG DOWNLOAD)
    // ========================================================================
    function CertificateModal({ playerName, passportId, levelNumber, xp, onClose }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);

        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#1e293b');
        grad.addColorStop(0.5, '#0f172a');
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.fillRect(20, 20, w - 40, h - 40);

        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.strokeRect(35, 35, w - 70, h - 70);
        ctx.lineWidth = 1.5;
        ctx.strokeRect(45, 45, w - 90, h - 90);

        const corners = [
          [35, 35], [w - 35, 35], [35, h - 35], [w - 35, h - 35]
        ];
        corners.forEach(([cx, cy]) => {
          ctx.beginPath();
          ctx.arc(cx, cy, 12, 0, Math.PI * 2);
          ctx.fillStyle = '#facc15';
          ctx.fill();
        });

        ctx.textAlign = 'center';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '700 16px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('AKADEMI TEKNOLOGI PENDIDIKAN & LITERASI DIGITAL', w / 2, 95);

        ctx.fillStyle = '#facc15';
        ctx.font = '700 30px "Cinzel", "Plus Jakarta Sans", serif';
        ctx.fillText('SERTIFIKAT KOMPETENSI PENJELAJAH EDTECH', w / 2, 145);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '500 16px "Plus Jakarta Sans", sans-serif';
        ctx.fillText('Sertifikat ini dengan bangga dianugerahkan kepada:', w / 2, 210);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '800 34px "Plus Jakarta Sans", sans-serif';
        ctx.fillText(playerName.toUpperCase(), w / 2, 265);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 14px "JetBrains Mono", monospace';
        ctx.fillText(`PASPOR ID: ${passportId}  •  TINGKAT: LEVEL ${levelNumber} (${xp} XP)`, w / 2, 305);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '400 15px "Plus Jakarta Sans", sans-serif';
        const textL1 = 'Telah berhasil menuntaskan seluruh penjelajahan pulau pembelajaran EdTech World,';
        const textL2 = 'menguasai Model ADDIE, Prinsip Multimedia Mayer, Pemilihan Media ASSURE,';
        const textL3 = 'serta Etika Pemanfaatan Artificial Intelligence & Literasi Siber secara paripurna.';
        ctx.fillText(textL1, w / 2, 355);
        ctx.fillText(textL2, w / 2, 380);
        ctx.fillText(textL3, w / 2, 405);

        ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(w / 2 - 200, 440);
        ctx.lineTo(w / 2 + 200, 440);
        ctx.stroke();

        const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 13px "Plus Jakarta Sans", sans-serif';
        ctx.fillText(`Diterbitkan pada: ${dateStr}`, w / 2, 470);

        ctx.textAlign = 'left';
        ctx.fillText('Prof. Voxel', 160, 520);
        ctx.fillText('Mentor AI Teknologi Pendidikan', 160, 540);
        ctx.beginPath();
        ctx.moveTo(160, 505);
        ctx.lineTo(340, 505);
        ctx.stroke();

        ctx.textAlign = 'right';
        ctx.fillText('Dewan Kurikulum EdTech', w - 160, 520);
        ctx.fillText('Lembaga Kurikulum Digital', w - 160, 540);
        ctx.beginPath();
        ctx.moveTo(w - 340, 505);
        ctx.lineTo(w - 160, 505);
        ctx.stroke();
      }, [playerName, passportId, levelNumber, xp]);

      const handleDownloadPng = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = `Sertifikat_EdTech_${playerName.replace(/\s+/g, '_')}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      return (
        <div role="dialog" className="fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-2xl rounded-3xl bg-slate-900 text-white shadow-2xl border border-white/20 p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-white/10 pb-3">
              <h3 className="font-extrabold text-sm text-amber-400">Pratinjau Sertifikat Kelulusan</h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:bg-white/10 cursor-pointer">
                <Icon name="X" className="w-4 h-4" />
              </button>
            </div>

            <div className="overflow-x-auto flex justify-center py-2">
              <canvas ref={canvasRef} width={800} height={580} className="w-full rounded-xl border border-white/10 shadow-2xl max-w-lg" />
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-white/10">
              <button onClick={onClose} className="px-4 py-2 text-xs font-bold text-slate-400 cursor-pointer">
                Tutup
              </button>
              <button
                onClick={handleDownloadPng}
                className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 font-extrabold text-xs cursor-pointer shadow-lg flex items-center gap-1.5"
              >
                <Icon name="Download" className="w-4 h-4 text-slate-950" />
                <span>Unduh Gambar Sertifikat (.PNG)</span>
              </button>
            </div>
          </div>
        </div>
      );
    }
